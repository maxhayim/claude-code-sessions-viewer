name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Python syntax check
        run: |
          python -m py_compile plugins/sessions-viewer/scripts/list_sessions.py
          python -m py_compile plugins/sessions-viewer/scripts/preview_session.py
          python -m py_compile plugins/sessions-viewer/scripts/live_sessions.py

      - name: Shellcheck
        run: |
          shellcheck -x bin/claude-sessions
          shellcheck plugins/sessions-viewer/scripts/cloud_sessions.sh
          shellcheck tests/test_live_sessions.sh tests/test_cloud_sessions.sh tests/test_claude_sessions_bash.sh tests/fixtures/claude

      - name: Validate marketplace.json
        run: python -m json.tool .claude-plugin/marketplace.json > /dev/null

      - name: Validate plugin.json
        run: python -m json.tool plugins/sessions-viewer/.claude-plugin/plugin.json > /dev/null

      - name: Functional tests
        run: |
          ./tests/test_list_sessions.sh
          ./tests/test_live_sessions.sh
          ./tests/test_cloud_sessions.sh
          ./tests/test_claude_sessions_bash.sh
